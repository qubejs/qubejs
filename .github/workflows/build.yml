name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm nx run-many -t test --codeCoverage -p core cms scripts web-react ui-material-base ui-reui-base integration-test
          pnpm nx run-many -t dist -p core scripts cms web-react ui-material-base ui-reui-base
