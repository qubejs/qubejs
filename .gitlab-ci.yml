image: node:22
stages:
  - build
variables:
  GIT_SUBMODULE_STRATEGY: recursive
before_script:
  - echo ======= before script start ========
  - export GENERATE_SOURCEMAP=false
  - node -v
  - corepack enable
  - pnpm -v
  - echo ======= before script done ========
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
  - .pnpm-store/
build_project:
  stage: build
  script:
    - echo ======= build started ========
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm nx run-many -t test --codeCoverage -p core cms scripts web-react
    - pnpm nx run-many -t dist -p core scripts cms web-react
    - echo ======= build finished ========
  artifacts:
      reports:
        junit:
          - coverage/libs/cms/junit.xml
          - coverage/libs/core/junit.xml
          - coverage/libs/web-react/junit.xml
  only:
    - main
    - merge_requests
build_release:
  stage: build
  script:
    - echo ======= release started ========
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
    - pnpm nx run-many -t publish  -p --args="--ver=$CI_COMMIT_TAG --tag=latest"
    - echo ======= release finished ========
  artifacts:
    reports:
      junit:
        - coverage/libs/cms/junit.xml
        - coverage/libs/core/junit.xml
        - coverage/libs/web-react/junit.xml
    expire_in: 48 hrs
  only:
    - tags